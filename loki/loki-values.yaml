deploymentMode: SimpleScalable

loki:
  storage:
    type: s3
    use_thanos_objstore: false
    bucketNames:
      chunks: loki
      ruler: loki-ruler
      admin: loki-admin
    s3:
      s3: http://minio.minio.svc.cluster.local:9000
      endpoint: minio.minio.svc.cluster.local:9000
      access_key_id: minioadmin
      secret_access_key: minioadmin
      s3ForcePathStyle: true
      insecure: true

  commonConfig:
    replication_factor: 1

  # Keep boltdb-shipper but tell Loki NOT to expect structured metadata
  limits_config:
    allow_structured_metadata: false

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: boltdb-shipper
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

# Size the scalable targets only (do NOT set ingester/querier/etc. in SimpleScalable)
backend:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }

read:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }

write:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }

# Turn off optional caches to simplify
resultsCache:
  enabled: false
chunksCache:
  enabled: false

gateway:
  enabled: true
  service:
    type: ClusterIP